name: Instagram Feed Sync

# 1시간마다 인스타그램 최신 게시물 4개를 가져와 커밋합니다.
# 커밋이 생기면 Amplify가 자동으로 재배포합니다.
on:
  # 매시 23분에 실행 (UTC). 정시(:00)는 전 세계 워크플로가 몰려
  # 지연·스킵이 잦으므로 혼잡을 피해 어중간한 분으로 지정합니다.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {} # 수동 실행 버튼

# 변경분을 커밋/푸시하기 위한 쓰기 권한
permissions:
  contents: write

# 동시 실행 방지 (겹쳐 돌면서 커밋 충돌나는 것 방지)
concurrency:
  group: instagram-feed
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Fetch latest Instagram posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/fetch-instagram.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/instagram src/data/instagramFeed.json
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "chore: sync Instagram feed"
            git push
          fi
